  </text>
  <text x="450" y="310" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="11"
        fill="#4f46e5" text-anchor="middle" font-weight="500">
    dharana-nidhini-k-k.github.io/DHARANA-NIDHINI-K-K
  </text>
  <line x1="150" y1="316" x2="300" y2="316" stroke="#1e293b" stroke-width="1"/>
  <line x1="600" y1="316" x2="750" y2="316" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="330" font-family="'Inter',sans-serif" font-size="9" fill="#334155" text-anchor="middle">
    Currently exploring stages 1–4 · Building towards stage 5
  </text>
</svg>

