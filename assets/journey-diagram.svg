<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="connGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5"/><stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <linearGradient id="s1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/><stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="s2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/><stop offset="100%" style="stop-color:#0c2a44"/>
    </linearGradient>
    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a"/><stop offset="100%" style="stop-color:#0a2f2c"/>
    </linearGradient>
    <linearGradient id="s4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b69"/><stop offset="100%" style="stop-color:#1b1040"/>
    </linearGradient>
    <linearGradient id="s5Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/><stop offset="100%" style="stop-color:#0a2018"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="340" rx="16" fill="url(#bg)"/>

  <!-- Section title -->
  <text x="450" y="34" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="14"
        fill="#94a3b8" text-anchor="middle" font-weight="600" letter-spacing="3">FROM CIRCUITS TO INTELLIGENT SYSTEMS</text>
  <line x1="140" y1="40" x2="340" y2="40" stroke="#334155" stroke-width="1"/>
  <line x1="560" y1="40" x2="760" y2="40" stroke="#334155" stroke-width="1"/>

  <!-- Progress bar (the journey path) -->
  <line x1="90" y1="162" x2="810" y2="162" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="162" x2="810" y2="162" stroke="url(#connGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 4" opacity="0.5"/>

  <!-- STAGE 1: HARDWARE FOUNDATION -->
  <g transform="translate(20, 65)">
    <rect width="140" height="195" rx="12" fill="url(#s1Grad)" filter="url(#cardShadow)"/>
    <rect width="140" height="195" rx="12" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
    <!-- Stage number -->
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#4f46e5"/>
    <text x="23" y="27" font-family="'Inter',sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">1</text>
    <!-- Stage icon: chip -->
    <rect x="52" y="10" width="76" height="26" rx="5" fill="#312e81" opacity="0.8"/>
    <text x="90" y="27" font-family="'Inter',sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle" font-weight="600">HARDWARE</text>
    <!-- Stage label -->
    <text x="70" y="58" font-family="'Inter',sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle" font-weight="700">Foundation</text>
    <!-- Divider -->
    <line x1="16" y1="66" x2="124" y2="66" stroke="#4f46e5" stroke-width="0.8" opacity="0.5"/>
    <!-- Items -->
    <g font-family="'Inter',sans-serif" font-size="10" fill="#94a3b8">
      <circle cx="24" cy="82" r="3" fill="#6366f1"/>
      <text x="34" y="86">Arduino Uno</text>
      <circle cx="24" cy="102" r="3" fill="#6366f1"/>
      <text x="34" y="106">ESP32</text>
      <circle cx="24" cy="122" r="3" fill="#6366f1"/>
      <text x="34" y="126">Microcontrollers</text>
      <circle cx="24" cy="142" r="3" fill="#6366f1"/>
      <text x="34" y="146">PCB Design</text>
      <circle cx="24" cy="162" r="3" fill="#6366f1"/>
      <text x="34" y="166">E. Circuits</text>
    </g>
    <!-- Bottom connector dot -->
    <circle cx="140" cy="97" r="6" fill="#4f46e5" filter="url(#iconGlow)"/>
  </g>

  <!-- Arrow 1→2 -->
  <g>
    <path d="M182 162 L198 162" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.9"/>
    <text x="190" y="155" font-family="'Inter',sans-serif" font-size="8" fill="#475569" text-anchor="middle">programs</text>
  </g>

