  <g transform="translate(740, 65)">
    <rect width="140" height="195" rx="12" fill="url(#s5Grad)" filter="url(#cardShadow)"/>
    <rect width="140" height="195" rx="12" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#16a34a"/>
    <text x="23" y="27" font-family="'Inter',sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">5</text>
    <rect x="52" y="10" width="76" height="26" rx="5" fill="#1a3a2a" opacity="0.8"/>
    <text x="90" y="27" font-family="'Inter',sans-serif" font-size="10" fill="#86efac" text-anchor="middle" font-weight="600">SOLUTIONS</text>
    <text x="70" y="58" font-family="'Inter',sans-serif" font-size="11" fill="#bbf7d0" text-anchor="middle" font-weight="700">Applications</text>
    <line x1="16" y1="66" x2="124" y2="66" stroke="#16a34a" stroke-width="0.8" opacity="0.5"/>
    <g font-family="'Inter',sans-serif" font-size="10" fill="#94a3b8">
      <circle cx="24" cy="82" r="3" fill="#16a34a"/>
      <text x="34" y="86">Smart Devices</text>
      <circle cx="24" cy="102" r="3" fill="#16a34a"/>
      <text x="34" y="106">IoT Systems</text>
      <circle cx="24" cy="122" r="3" fill="#16a34a"/>
      <text x="34" y="126">Automation</text>
      <circle cx="24" cy="142" r="3" fill="#16a34a"/>
      <text x="34" y="146">AI Engineering</text>
      <circle cx="24" cy="162" r="3" fill="#16a34a"/>
      <text x="34" y="166">Real Projects ✓</text>
    </g>
    <circle cx="0" cy="97" r="6" fill="#16a34a" filter="url(#iconGlow)"/>
