    <rect width="140" height="195" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#7c3aed"/>
    <text x="23" y="27" font-family="'Inter',sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">4</text>
    <rect x="52" y="10" width="76" height="26" rx="5" fill="#2d1b69" opacity="0.8"/>
    <text x="90" y="27" font-family="'Inter',sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle" font-weight="600">INTELLIGENCE</text>
