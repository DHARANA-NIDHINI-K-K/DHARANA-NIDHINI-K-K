    <rect width="140" height="195" rx="12" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#3b82f6"/>
    <text x="23" y="27" font-family="'Inter',sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">2</text>
    <rect x="52" y="10" width="76" height="26" rx="5" fill="#1e3a5f" opacity="0.8"/>
    <text x="90" y="27" font-family="'Inter',sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">EMBEDDED</text>
    <text x="70" y="58" font-family="'Inter',sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle" font-weight="700">Development</text>
    <line x1="16" y1="66" x2="124" y2="66" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
    <g font-family="'Inter',sans-serif" font-size="10" fill="#94a3b8">
      <circle cx="24" cy="82" r="3" fill="#3b82f6"/>
      <text x="34" y="86">Embedded C</text>
      <circle cx="24" cy="102" r="3" fill="#3b82f6"/>
      <text x="34" y="106">Firmware Dev</text>
      <circle cx="24" cy="122" r="3" fill="#3b82f6"/>
      <text x="34" y="126">GPIO Control</text>
      <circle cx="24" cy="142" r="3" fill="#3b82f6"/>
      <text x="34" y="146">Sensor I/O</text>
      <circle cx="24" cy="162" r="3" fill="#3b82f6"/>
      <text x="34" y="166">Protocols</text>
    </g>
    <circle cx="0" cy="97" r="6" fill="#3b82f6" filter="url(#iconGlow)"/>
    <circle cx="140" cy="97" r="6" fill="#3b82f6" filter="url(#iconGlow)"/>
  </g>

  <!-- Arrow 2→3 -->
  <g>
    <path d="M362 162 L378 162" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.9"/>
    <text x="370" y="155" font-family="'Inter',sans-serif" font-size="8" fill="#475569" text-anchor="middle">connects</text>
