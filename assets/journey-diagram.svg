    <rect x="12" y="12" width="22" height="22" rx="6" fill="#0d9488"/>
    <text x="23" y="27" font-family="'Inter',sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">3</text>
    <rect x="52" y="10" width="76" height="26" rx="5" fill="#134e4a" opacity="0.8"/>
    <text x="90" y="27" font-family="'Inter',sans-serif" font-size="10" fill="#5eead4" text-anchor="middle" font-weight="600">DATA + IoT</text>
