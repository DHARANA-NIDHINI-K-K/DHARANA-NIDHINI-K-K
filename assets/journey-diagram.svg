    <line x1="16" y1="66" x2="124" y2="66" stroke="#0d9488" stroke-width="0.8" opacity="0.5"/>
    <g font-family="'Inter',sans-serif" font-size="10" fill="#94a3b8">
      <circle cx="24" cy="82" r="3" fill="#0d9488"/>
      <text x="34" y="86">Sensors</text>
      <circle cx="24" cy="102" r="3" fill="#0d9488"/>
      <text x="34" y="106">Actuators</text>
      <circle cx="24" cy="122" r="3" fill="#0d9488"/>
      <text x="34" y="126">UART · SPI · I²C</text>
      <circle cx="24" cy="142" r="3" fill="#0d9488"/>
      <text x="34" y="146">IoT Protocols</text>
      <circle cx="24" cy="162" r="3" fill="#0d9488"/>
      <text x="34" y="166">Data Streams</text>
    </g>
