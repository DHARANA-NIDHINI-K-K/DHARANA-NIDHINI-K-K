    <g font-family="'Inter',sans-serif" font-size="10" fill="#94a3b8">
      <circle cx="24" cy="82" r="3" fill="#7c3aed"/>
      <text x="34" y="86">Python</text>
      <circle cx="24" cy="102" r="3" fill="#7c3aed"/>
      <text x="34" y="106">Data Processing</text>
      <circle cx="24" cy="122" r="3" fill="#7c3aed"/>
      <text x="34" y="126">AI/ML Basics</text>
      <circle cx="24" cy="142" r="3" fill="#7c3aed"/>
      <text x="34" y="146">Streamlit</text>
      <circle cx="24" cy="162" r="3" fill="#7c3aed"/>
      <text x="34" y="166">Edge Computing</text>
    </g>
    <circle cx="0" cy="97" r="6" fill="#7c3aed" filter="url(#iconGlow)"/>
    <circle cx="140" cy="97" r="6" fill="#7c3aed" filter="url(#iconGlow)"/>
  </g>

  <!-- Arrow 4→5 -->
  <g>
    <path d="M722 162 L738 162" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.9"/>
    <text x="730" y="155" font-family="'Inter',sans-serif" font-size="8" fill="#475569" text-anchor="middle">builds</text>
