<svg width="400" height="420" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020b18"/>
      <stop offset="100%" style="stop-color:#050e2a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background card -->
  <rect width="400" height="420" rx="14" fill="url(#bg)"/>
  <rect width="400" height="420" rx="14" fill="none" stroke="#00ffe0" stroke-width="1.2" opacity="0.4"/>

  <!-- Corner accents -->
  <path d="M0 20 L0 0 L20 0" stroke="#00ffe0" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M380 0 L400 0 L400 20" stroke="#00ffe0" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M0 400 L0 420 L20 420" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M400 400 L400 420 L380 420" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Title label -->
  <rect x="10" y="8" width="140" height="18" rx="4" fill="#00ffe0" opacity="0.12"/>
  <text x="18" y="21" font-family="'Courier New', monospace" font-size="9" fill="#00ffe0" letter-spacing="1.5">EMBEDDED MCU CORE</text>

  <!-- ── CHIP BODY ── -->
  <rect x="120" y="80" width="160" height="200" rx="8" fill="#0a1628" stroke="#00ffe0" stroke-width="1.5" filter="url(#glow)" opacity="0.95"/>

  <!-- Chip inner grid pattern -->
  <g opacity="0.08" stroke="#00ffe0" stroke-width="0.5">
    <line x1="140" y1="80" x2="140" y2="280"/>
    <line x1="160" y1="80" x2="160" y2="280"/>
    <line x1="180" y1="80" x2="180" y2="280"/>
    <line x1="200" y1="80" x2="200" y2="280"/>
    <line x1="220" y1="80" x2="220" y2="280"/>
    <line x1="240" y1="80" x2="240" y2="280"/>
    <line x1="260" y1="80" x2="260" y2="280"/>
    <line x1="120" y1="100" x2="280" y2="100"/>
    <line x1="120" y1="120" x2="280" y2="120"/>
    <line x1="120" y1="140" x2="280" y2="140"/>
    <line x1="120" y1="160" x2="280" y2="160"/>
    <line x1="120" y1="180" x2="280" y2="180"/>
    <line x1="120" y1="200" x2="280" y2="200"/>
    <line x1="120" y1="220" x2="280" y2="220"/>
    <line x1="120" y1="240" x2="280" y2="240"/>
    <line x1="120" y1="260" x2="280" y2="260"/>
  </g>

  <!-- Chip label -->
  <text x="200" y="155" font-family="'Courier New', monospace" font-size="13" fill="#00ffe0"
        text-anchor="middle" font-weight="bold" filter="url(#glow)" letter-spacing="1">ESP32</text>
  <text x="200" y="173" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8"
        text-anchor="middle" letter-spacing="1">DUAL-CORE MCU</text>

  <!-- Inner chip block -->
  <rect x="148" y="188" width="104" height="60" rx="4" fill="#0d1f3c" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  <text x="200" y="213" font-family="'Courier New', monospace" font-size="8" fill="#3b82f6"
        text-anchor="middle" letter-spacing="0.5">XTENSA LX6</text>
  <text x="200" y="226" font-family="'Courier New', monospace" font-size="7" fill="#64748b"
        text-anchor="middle">240MHz · 520KB RAM</text>
  <text x="200" y="239" font-family="'Courier New', monospace" font-size="7" fill="#64748b"
        text-anchor="middle">WiFi · BT · GPIO</text>

  <!-- ── LEFT PINS ── -->
  <g stroke="#00ffe0" stroke-width="1.5" fill="none" opacity="0.8">
    <line x1="80" y1="100" x2="120" y2="100"/>
    <line x1="80" y1="118" x2="120" y2="118"/>
    <line x1="80" y1="136" x2="120" y2="136"/>
    <line x1="80" y1="154" x2="120" y2="154"/>
    <line x1="80" y1="172" x2="120" y2="172"/>
    <line x1="80" y1="190" x2="120" y2="190"/>
    <line x1="80" y1="208" x2="120" y2="208"/>
    <line x1="80" y1="226" x2="120" y2="226"/>
    <line x1="80" y1="244" x2="120" y2="244"/>
    <line x1="80" y1="262" x2="120" y2="262"/>
  </g>
  <!-- Left pin dots -->
  <g fill="#00ffe0" filter="url(#glow)" opacity="0.9">
    <circle cx="80" cy="100" r="3"/>
    <circle cx="80" cy="118" r="3"/>
    <circle cx="80" cy="136" r="3"/>
    <circle cx="80" cy="154" r="3"/>
    <circle cx="80" cy="172" r="3"/>
    <circle cx="80" cy="190" r="3"/>
    <circle cx="80" cy="208" r="3"/>
    <circle cx="80" cy="226" r="3"/>
    <circle cx="80" cy="244" r="3"/>
    <circle cx="80" cy="262" r="3"/>
  </g>
  <!-- Left pin labels -->
  <g font-family="'Courier New', monospace" font-size="7" fill="#64748b" text-anchor="end">
    <text x="74" y="103">GPIO0</text>
    <text x="74" y="121">GPIO2</text>
    <text x="74" y="139">GPIO4</text>
    <text x="74" y="157">GPIO5</text>
    <text x="74" y="175">GPIO12</text>
    <text x="74" y="193">GPIO13</text>
    <text x="74" y="211">GPIO14</text>
    <text x="74" y="229">GPIO15</text>
    <text x="74" y="247">SDA</text>
    <text x="74" y="265">SCL</text>
  </g>

  <!-- ── RIGHT PINS ── -->
  <g stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.8">
    <line x1="280" y1="100" x2="320" y2="100"/>
    <line x1="280" y1="118" x2="320" y2="118"/>
    <line x1="280" y1="136" x2="320" y2="136"/>
    <line x1="280" y1="154" x2="320" y2="154"/>
    <line x1="280" y1="172" x2="320" y2="172"/>
    <line x1="280" y1="190" x2="320" y2="190"/>
    <line x1="280" y1="208" x2="320" y2="208"/>
    <line x1="280" y1="226" x2="320" y2="226"/>
    <line x1="280" y1="244" x2="320" y2="244"/>
    <line x1="280" y1="262" x2="320" y2="262"/>
  </g>
  <!-- Right pin dots -->
  <g fill="#a855f7" filter="url(#glow)" opacity="0.9">
    <circle cx="320" cy="100" r="3"/>
    <circle cx="320" cy="118" r="3"/>
    <circle cx="320" cy="136" r="3"/>
    <circle cx="320" cy="154" r="3"/>
    <circle cx="320" cy="172" r="3"/>
    <circle cx="320" cy="190" r="3"/>
    <circle cx="320" cy="208" r="3"/>
    <circle cx="320" cy="226" r="3"/>
    <circle cx="320" cy="244" r="3"/>
    <circle cx="320" cy="262" r="3"/>
  </g>
  <!-- Right pin labels -->
  <g font-family="'Courier New', monospace" font-size="7" fill="#64748b" text-anchor="start">
    <text x="326" y="103">3.3V</text>
    <text x="326" y="121">GND</text>
    <text x="326" y="139">EN</text>
    <text x="326" y="157">GPIO34</text>
    <text x="326" y="175">GPIO35</text>
    <text x="326" y="193">ADC0</text>
    <text x="326" y="211">ADC1</text>
    <text x="326" y="229">TX</text>
    <text x="326" y="247">RX</text>
    <text x="326" y="265">CLK</text>
  </g>

  <!-- ── BOTTOM PINS ── -->
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.8">
    <line x1="145" y1="280" x2="145" y2="310"/>
    <line x1="165" y1="280" x2="165" y2="310"/>
    <line x1="185" y1="280" x2="185" y2="310"/>
    <line x1="205" y1="280" x2="205" y2="310"/>
    <line x1="225" y1="280" x2="225" y2="310"/>
    <line x1="245" y1="280" x2="245" y2="310"/>
  </g>
  <g fill="#3b82f6" filter="url(#glow)" opacity="0.9">
    <circle cx="145" cy="310" r="3"/>
    <circle cx="165" cy="310" r="3"/>
    <circle cx="185" cy="310" r="3"/>
    <circle cx="205" cy="310" r="3"/>
    <circle cx="225" cy="310" r="3"/>
    <circle cx="245" cy="310" r="3"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="7" fill="#64748b" text-anchor="middle">
    <text x="145" y="323">PWM</text>
    <text x="165" y="323">SPI</text>
    <text x="185" y="323">I2C</text>
    <text x="205" y="323">INT</text>
    <text x="225" y="323">DAC</text>
    <text x="245" y="323">USB</text>
  </g>

  <!-- PCB trace lines (bottom section) -->
  <g opacity="0.4" stroke="#00ffe0" stroke-width="1" fill="none">
    <line x1="145" y1="323" x2="145" y2="345"/>
    <line x1="145" y1="345" x2="80" y2="345"/>
    <circle cx="80" cy="345" r="3" fill="#00ffe0"/>
    <line x1="245" y1="323" x2="245" y2="360"/>
    <line x1="245" y1="360" x2="320" y2="360"/>
    <circle cx="320" cy="360" r="3" fill="#00ffe0"/>
  </g>
  <g opacity="0.4" stroke="#a855f7" stroke-width="1" fill="none">
    <line x1="205" y1="323" x2="205" y2="380"/>
    <line x1="205" y1="380" x2="140" y2="380"/>
    <circle cx="140" cy="380" r="3" fill="#a855f7"/>
    <line x1="185" y1="323" x2="185" y2="395"/>
    <line x1="185" y1="395" x2="260" y2="395"/>
    <circle cx="260" cy="395" r="3" fill="#a855f7"/>
  </g>

  <!-- Status indicators -->
  <g>
    <circle cx="340" cy="58" r="5" fill="#00ff88" opacity="0.9" filter="url(#glow)"/>
    <text x="350" y="62" font-family="'Courier New', monospace" font-size="8" fill="#00ff88">ACTIVE</text>
  </g>
  <g>
    <circle cx="340" cy="78" r="4" fill="#3b82f6" opacity="0.7" filter="url(#glow)"/>
    <text x="350" y="82" font-family="'Courier New', monospace" font-size="8" fill="#3b82f6">WiFi ON</text>
  </g>

  <!-- Signal wave (top section) -->
  <g opacity="0.5" stroke="#00ffe0" stroke-width="1.2" fill="none">
    <path d="M30 55 Q38 45 46 55 Q54 65 62 55"/>
  </g>
  <text x="68" y="59" font-family="'Courier New', monospace" font-size="8" fill="#00ffe0" opacity="0.6">~SIG</text>

  <!-- Bottom label -->
  <text x="200" y="413" font-family="'Courier New', monospace" font-size="8" fill="#334155"
        text-anchor="middle" letter-spacing="1.5">EMBEDDED SYSTEMS · EEE ENGINEERING</text>
</svg>

