<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Material 3 Dark Background -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <!-- Primary Indigo Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="60%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <!-- Teal accent -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <!-- Surface card gradient -->
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95"/>
    </linearGradient>
    <!-- Soft glow for name -->
    <filter id="nameGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Chip shadow -->
    <filter id="chipShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
    <!-- Subtle dot pattern -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#818cf8" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#heroBg)" rx="16"/>
  <!-- Dot overlay -->
  <rect width="900" height="300" fill="url(#dotPattern)" rx="16" opacity="0.6"/>

  <!-- Left decorative PCB art -->
  <!-- PCB board shape -->
  <rect x="30" y="60" width="180" height="180" rx="10" fill="#1e293b" opacity="0.7" filter="url(#chipShadow)"/>
  <rect x="30" y="60" width="180" height="180" rx="10" fill="none" stroke="#4f46e5" stroke-width="1" opacity="0.5"/>

  <!-- PCB traces -->
  <g stroke="#4f46e5" stroke-width="1.5" fill="none" opacity="0.6">
    <line x1="50" y1="90" x2="100" y2="90"/>
    <line x1="100" y1="90" x2="100" y2="130"/>
    <line x1="100" y1="130" x2="150" y2="130"/>
    <line x1="150" y1="90" x2="150" y2="170"/>
    <line x1="80" y1="170" x2="150" y2="170"/>
    <line x1="80" y1="150" x2="80" y2="210"/>
    <line x1="80" y1="210" x2="180" y2="210"/>
    <line x1="180" y1="180" x2="180" y2="210"/>
    <line x1="130" y1="90" x2="190" y2="90"/>
    <line x1="190" y1="90" x2="190" y2="150"/>
    <line x1="190" y1="150" x2="160" y2="150"/>
  </g>
  <!-- Teal traces -->
  <g stroke="#2dd4bf" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="50" y1="110" x2="70" y2="110"/>
    <line x1="70" y1="110" x2="70" y2="195"/>
    <line x1="70" y1="195" x2="140" y2="195"/>
    <line x1="140" y1="195" x2="140" y2="150"/>
    <line x1="50" y1="145" x2="60" y2="145"/>
    <line x1="60" y1="145" x2="60" y2="160"/>
    <line x1="60" y1="160" x2="120" y2="160"/>
  </g>

  <!-- PCB via dots (indigo) -->
  <g fill="#4f46e5" opacity="0.9">
    <circle cx="100" cy="90" r="4"/>
    <circle cx="100" cy="130" r="4"/>
    <circle cx="150" cy="130" r="4"/>
    <circle cx="150" cy="170" r="4"/>
    <circle cx="80" cy="170" r="4"/>
    <circle cx="80" cy="210" r="4"/>
    <circle cx="180" cy="210" r="4"/>
    <circle cx="190" cy="90" r="4"/>
    <circle cx="190" cy="150" r="4"/>
  </g>
  <!-- Via dots (teal) -->
  <g fill="#2dd4bf" opacity="0.9">
    <circle cx="70" cy="110" r="3.5"/>
    <circle cx="70" cy="195" r="3.5"/>
    <circle cx="140" cy="195" r="3.5"/>
    <circle cx="140" cy="150" r="3.5"/>
  </g>

  <!-- Central chip on PCB -->
  <rect x="95" y="105" width="70" height="70" rx="5" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Chip pins left -->
  <g stroke="#818cf8" stroke-width="1.2" fill="none" opacity="0.8">
    <line x1="85" y1="115" x2="95" y2="115"/>
    <line x1="85" y1="125" x2="95" y2="125"/>
    <line x1="85" y1="135" x2="95" y2="135"/>
    <line x1="85" y1="145" x2="95" y2="145"/>
    <line x1="85" y1="155" x2="95" y2="155"/>
    <line x1="85" y1="165" x2="95" y2="165"/>
  </g>
  <!-- Chip pins right -->
  <g stroke="#818cf8" stroke-width="1.2" fill="none" opacity="0.8">
    <line x1="165" y1="115" x2="175" y2="115"/>
    <line x1="165" y1="125" x2="175" y2="125"/>
    <line x1="165" y1="135" x2="175" y2="135"/>
    <line x1="165" y1="145" x2="175" y2="145"/>
    <line x1="165" y1="155" x2="175" y2="155"/>
    <line x1="165" y1="165" x2="175" y2="165"/>
  </g>
  <!-- Chip label -->
  <text x="130" y="136" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" fill="#818cf8" text-anchor="middle" font-weight="600">MCU</text>
  <text x="130" y="150" font-family="'Inter', 'Segoe UI', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">ESP32</text>
  <text x="130" y="162" font-family="'Inter', 'Segoe UI', sans-serif" font-size="7" fill="#475569" text-anchor="middle">Dual Core</text>

  <!-- Capacitors and resistors on PCB -->
  <rect x="48" y="82" width="8" height="16" rx="2" fill="#1e3a5f" stroke="#4f46e5" stroke-width="1" opacity="0.7"/>
  <rect x="195" y="102" width="8" height="16" rx="2" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="1" opacity="0.7"/>
  <rect x="48" y="202" width="16" height="8" rx="2" fill="#1e3a5f" stroke="#6366f1" stroke-width="1" opacity="0.7"/>

  <!-- Main content area - right side -->
  <!-- Large name -->
  <text x="260" y="108" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700"
        fill="url(#nameGrad)" filter="url(#nameGlow)" letter-spacing="-0.5">DHARANA NIDHINI K K</text>

  <!-- Subtitle -->
  <text x="262" y="140" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="15"
        fill="#94a3b8" font-weight="400" letter-spacing="0.3">B.E. Electrical &amp; Electronics Engineering</text>
  <text x="262" y="160" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13"
        fill="#64748b" letter-spacing="0.5">Bannari Amman Institute of Technology · 3rd Year</text>

  <!-- Tagline -->
  <text x="262" y="193" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13"
        fill="#2dd4bf" font-style="italic" letter-spacing="0.2">
    "Bridging the gap between electronics,
  </text>
  <text x="262" y="210" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13"
        fill="#2dd4bf" font-style="italic" letter-spacing="0.2">
     intelligent systems and software."
  </text>

  <!-- Material 3 Chips row -->
  <g font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500">
    <!-- Chip 1: Embedded Systems -->
    <rect x="262" y="228" width="128" height="28" rx="14" fill="#312e81" opacity="0.8"/>
    <rect x="262" y="228" width="128" height="28" rx="14" fill="none" stroke="#4f46e5" stroke-width="1"/>
    <text x="326" y="247" fill="#a5b4fc" text-anchor="middle">Embedded Systems</text>

    <!-- Chip 2: Electronics -->
    <rect x="398" y="228" width="90" height="28" rx="14" fill="#134e4a" opacity="0.8"/>
    <rect x="398" y="228" width="90" height="28" rx="14" fill="none" stroke="#0d9488" stroke-width="1"/>
    <text x="443" y="247" fill="#5eead4" text-anchor="middle">Electronics</text>

    <!-- Chip 3: IoT -->
    <rect x="496" y="228" width="52" height="28" rx="14" fill="#1e1b4b" opacity="0.8"/>
    <rect x="496" y="228" width="52" height="28" rx="14" fill="none" stroke="#6366f1" stroke-width="1"/>
    <text x="522" y="247" fill="#818cf8" text-anchor="middle">IoT</text>

    <!-- Chip 4: AI -->
    <rect x="556" y="228" width="42" height="28" rx="14" fill="#2d1b69" opacity="0.8"/>
    <rect x="556" y="228" width="42" height="28" rx="14" fill="none" stroke="#7c3aed" stroke-width="1"/>
    <text x="577" y="247" fill="#c4b5fd" text-anchor="middle">AI</text>

    <!-- Chip 5: PCB Design -->
    <rect x="606" y="228" width="92" height="28" rx="14" fill="#312e81" opacity="0.8"/>
    <rect x="606" y="228" width="92" height="28" rx="14" fill="none" stroke="#4f46e5" stroke-width="1"/>
    <text x="652" y="247" fill="#a5b4fc" text-anchor="middle">PCB Design</text>

    <!-- Chip 6: Software Dev -->
    <rect x="706" y="228" width="102" height="28" rx="14" fill="#134e4a" opacity="0.8"/>
    <rect x="706" y="228" width="102" height="28" rx="14" fill="none" stroke="#0d9488" stroke-width="1"/>
    <text x="757" y="247" fill="#5eead4" text-anchor="middle">Software Dev</text>
  </g>

  <!-- Bottom divider line with gradient -->
  <line x1="260" y1="276" x2="880" y2="276" stroke="url(#nameGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Bottom status row -->
  <circle cx="272" cy="288" r="4" fill="#22c55e" opacity="0.9"/>
  <text x="284" y="292" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">
    Open to collaboration · Hardware + Software Projects
  </text>

  <!-- Right decoration: signal waves -->
  <g stroke="#4f46e5" stroke-width="1.2" fill="none" opacity="0.3">
    <path d="M840 60 Q855 42 870 60 Q885 78 900 60"/>
    <path d="M840 80 Q855 62 870 80 Q885 98 900 80"/>
    <path d="M840 100 Q855 82 870 100 Q885 118 900 100"/>
  </g>

  <!-- Top-right corner accent -->
  <path d="M870 16 L900 16 L900 46" stroke="url(#tealGrad)" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Top-left corner accent -->
  <path d="M16 16 L0 16 L0 46" stroke="url(#nameGrad)" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Bottom-right corner accent -->
  <path d="M870 284 L900 284 L900 254" stroke="url(#nameGrad)" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Bottom-left corner accent -->
  <path d="M16 284 L0 284 L0 254" stroke="url(#tealGrad)" stroke-width="2" fill="none" opacity="0.7"/>
</svg>

