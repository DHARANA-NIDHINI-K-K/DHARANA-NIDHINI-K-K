  <text x="20" y="74" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">
    IoT + AI Student Assessment Platform
  </text>

  <text x="20" y="96" font-family="'Courier New', monospace" font-size="9" fill="#64748b">
    Rule-based AI identifies knowledge gaps
  </text>
  <text x="20" y="110" font-family="'Courier New', monospace" font-size="9" fill="#64748b">
    with Streamlit dashboard &amp; SQLite backend.
  </text>

  <g font-family="'Courier New', monospace" font-size="8">
    <rect x="20" y="122" width="40" height="16" rx="8" fill="#a855f715" stroke="#a855f7" stroke-width="0.8"/>
    <text x="40" y="134" fill="#a855f7" text-anchor="middle">Python</text>

    <rect x="66" y="122" width="52" height="16" rx="8" fill="#3b82f615" stroke="#3b82f6" stroke-width="0.8"/>
