<svg width="380" height="200" viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0520"/><stop offset="100%" style="stop-color:#020b18"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="380" height="200" rx="12" fill="url(#bg)"/>
  <rect width="380" height="200" rx="12" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.5"/>
  <rect x="20" y="0" width="80" height="2" fill="#a855f7" opacity="0.8"/>
  <text x="20" y="30" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" opacity="0.6" letter-spacing="1">PROJECT_02</text>

  <!-- IoT+AI icon -->
  <g transform="translate(290, 15)">
    <circle cx="35" cy="30" r="22" fill="#0a0a2a" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
    <text x="35" y="26" font-family="'Courier New', monospace" font-size="8" fill="#a855f7" text-anchor="middle">IoT</text>
    <text x="35" y="37" font-family="'Courier New', monospace" font-size="8" fill="#3b82f6" text-anchor="middle">+AI</text>
    <!-- Orbit ring -->
    <ellipse cx="35" cy="30" rx="30" ry="10" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  </g>

  <text x="20" y="58" font-family="'Courier New', monospace" font-size="13" font-weight="bold"
