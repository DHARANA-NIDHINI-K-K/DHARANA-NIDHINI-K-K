<svg width="800" height="140" viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020b18"/>
      <stop offset="100%" style="stop-color:#050e2a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffe0"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <!-- Clip for text scroll animation -->
    <clipPath id="clip"><rect x="0" y="0" width="800" height="140"/></clipPath>
  </defs>

  <rect width="800" height="140" rx="10" fill="url(#bg)"/>
  <rect width="800" height="140" rx="10" fill="none" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="140" rx="2" fill="url(#cyanGrad)"/>

  <!-- Terminal prompt icon -->
  <rect x="20" y="18" width="100" height="22" rx="4" fill="#0a1628"/>
  <text x="27" y="34" font-family="'Courier New', monospace" font-size="11" fill="#00ffe0" filter="url(#glow)">❯ init.sh</text>

  <!-- Section header -->
  <text x="20" y="72" font-family="'Courier New', monospace" font-size="22" font-weight="bold"
        fill="url(#cyanGrad)" filter="url(#glow)" letter-spacing="2">SKILLS &amp; TECHNOLOGIES</text>
  <text x="20" y="92" font-family="'Courier New', monospace" font-size="11" fill="#64748b" letter-spacing="1">
    // Embedded · Electronics · IoT · AI · Software
  </text>

  <!-- Right decoration: oscilloscope-like wave -->
  <g opacity="0.5" stroke="#00ffe0" stroke-width="1.5" fill="none" filter="url(#glow)">
    <polyline points="560,70 575,40 590,100 605,40 620,100 635,55 650,55 665,40 680,100 695,70"/>
  </g>
  <text x="560" y="118" font-family="'Courier New', monospace" font-size="8" fill="#334155">~PWM SIGNAL</text>

  <!-- Bottom status bar -->
  <rect x="0" y="122" width="800" height="18" rx="0" fill="#050e2a" opacity="0.8"/>
  <circle cx="16" cy="131" r="4" fill="#00ff88" opacity="0.8"/>
  <text x="26" y="135" font-family="'Courier New', monospace" font-size="8" fill="#64748b">STATUS: LEARNING &amp; BUILDING · 3rd Year EEE · BIT Erode</text>
</svg>

